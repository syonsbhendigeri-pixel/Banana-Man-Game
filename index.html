<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BANANA MAN ADVENTURES</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(circle at top,#aee6ff 0%,#67b6ff 45%,#2c7cd6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}
#wrap{position:relative;width:960px;height:540px;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;width:960px;height:540px;}
#scanlines{position:absolute;top:0;left:0;width:960px;height:540px;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(255,255,255,0.04) 4px,rgba(255,255,255,0.04) 5px);}
#crt{position:absolute;top:0;left:0;width:960px;height:540px;pointer-events:none;z-index:31;border-radius:8px;box-shadow:inset 0 0 34px rgba(0,0,0,0.18),0 12px 30px rgba(0,0,0,0.18);}
#ui{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:space-between;padding:0 10px;font-family:'Press Start 2P',monospace;font-size:7px;color:#ffe000;text-shadow:2px 2px #000,0 0 8px #ff8800;pointer-events:none;z-index:10;}
#msgOverlay{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.88);z-index:99999;pointer-events:auto;border:3px solid #ffe000;box-shadow:0 0 30px #ff8800,inset 0 0 30px rgba(255,140,0,0.05);}
#msgOverlay h2{font-family:'Press Start 2P',monospace;font-size:11px;margin-bottom:8px;color:#ffe000;text-shadow:3px 3px #000,0 0 12px #ff8800;letter-spacing:1px;}
#msgOverlay p{font-family:'Press Start 2P',monospace;font-size:6px;color:#ddd;max-width:440px;line-height:2;text-align:center;}
#msgOverlay button{margin-top:16px;padding:8px 20px;background:#000;color:#ffe000;border:3px solid #ffe000;font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer;letter-spacing:1px;box-shadow:0 0 10px #ff8800;pointer-events:auto;position:relative;z-index:100000;}
#msgOverlay button:hover{background:#ffe000;color:#000;}
#msgOverlay button:active{transform:scale(0.96);}
#titleBig{font-family:'Press Start 2P',monospace;font-size:18px;color:#ffe000;text-shadow:4px 4px #000,0 0 20px #ff8800,-2px -2px #ff4400;letter-spacing:2px;margin-bottom:6px;animation:blink 1.2s step-end infinite;}
@keyframes blink{50%{opacity:0.7;}}
#controls{font-family:'Press Start 2P',monospace;font-size:5px;color:#555;text-align:center;margin-top:4px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gameCanvas" width="640" height="360"></canvas>
  <div id="scanlines"></div>
  <div id="crt"></div>
  <div id="ui">
    <span id="scoreUI">SCORE:000000</span>
    <span id="levelUI">ACT-1</span>
    <span id="livesUI">LIVES:3 BAN:00</span>
  </div>
</div>
<div id="msgOverlay">
    <div id="titleBig">BANANA MAN</div>
    <h2>&gt;&gt; ADVENTURES &lt;&lt;</h2>
    <p id="msgBody">...</p>
    <button id="msgBtn">INSERT COIN</button>
  </div>
<div id="controls">ARROWS/WASD:MOVE | SPACE/UP:JUMP | F:FIRE | R:ICE | Q:RADIATION | TAB+SHIFT+CTRL+H:SKIP TO END</div>

let keys={};
let jumpConsumed=false; // prevents jump re-trigger while key held
let jumpBuffer=0;   // frames since jump was pressed (buffer window)
let coyoteTime=0;   // frames since left ground (coyote window)
let cheatCombo={Tab:false,ShiftLeft:false,ShiftRight:false,ControlLeft:false,ControlRight:false,KeyH:false};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)&&e.preventDefault();
  // Tab+Shift+Ctrl+H teleport cheat
  if(e.code==='Tab')e.preventDefault();
  cheatCombo[e.code]=true;
  if(cheatCombo.Tab&&(cheatCombo.ShiftLeft||cheatCombo.ShiftRight)&&(cheatCombo.ControlLeft||cheatCombo.ControlRight)&&cheatCombo.KeyH){
    if(state==='playing'){
      // Teleport to end of level
      const endX=gameLevel===1?6750:5800;
      player.x=endX; player.y=250; player.vx=0; player.vy=0;
      camera.x=Math.max(0,endX-W/3);
      score+=500;
      // activate boss if present
      if(boss&&boss.alive&&!boss.active){ boss.active=true; }
    }
  }
});
document.addEventListener('keyup',e=>{
  keys[e.code]=false;cheatCombo[e.code]=false;
  if(['Space','ArrowUp','KeyW'].includes(e.code)){jumpConsumed=false;jumpBuffer=0;}
});

const msgBtn=document.getElementById('msgBtn');
const titleBig=document.getElementById('titleBig');
msgBtn.addEventListener('click',dismissMsg);
msgBtn.addEventListener('touchend',function(e){e.preventDefault();dismissMsg();});
document.addEventListener('keydown',function(e){
  if(msgShown&&(e.code==='Enter'||e.code==='Space'||e.code==='KeyZ')){
    e.preventDefault();dismissMsg();
  }
});

function showMsg(big,title,body,btn){
  titleBig.textContent=big||'BANANA MAN';
  document.getElementById('msgOverlay').querySelector('h2').textContent=title;
  msgBody.innerHTML=body;
  msgBtn.textContent=btn||'CONTINUE';
  overlay.style.display='flex';
  msgShown=true;
}
function dismissMsg(){
  overlay.style.display='none';msgShown=false;
  if(state==='title'){state='playing';initLevel(1);}
  else if(state==='transition'){state='playing';initLevel(gameLevel);}
  else if(state==='fakeboss'){activateRealBoss();}
  else if(state==='win'||state==='gameover'){resetGame();}
  else if(state==='dead'){state='playing';respawn();}
}

function allPlats(){return[...platforms,...movingPlats];}
function moveMovingPlatforms(){
  for(let mp of movingPlats){
    mp.prevX=mp.x;mp.prevY=mp.y;
    mp.x+=mp.vx;
    if(mp.x<mp.minX){mp.x=mp.minX;mp.vx=Math.abs(mp.vx);}
    if(mp.x>mp.maxX){mp.x=mp.maxX;mp.vx=-Math.abs(mp.vx);}
    mp.dx=mp.x-mp.prevX;mp.dy=mp.y-mp.prevY;
  }
}
function playerPlats(){
  if(!slopes.length)return allPlats();
  // When slopes handle main ground (h>20), only include thin platforms for direct collision
  // This prevents the player from "walking" on thick ground chunks through gaps
  return allPlats().filter(p=>movingPlats.includes(p)||p.h<=22);
}
function platformSupport(obj){
  let best=null,bestY=Infinity;
  const plats=obj===player?playerPlats():allPlats();
  for(const p of plats){
    const foot=obj.y+obj.h;
    const withinX=obj.x+obj.w>p.x+2&&obj.x<p.x+p.w-2;
    const nearTop=foot>=p.y-4&&foot<=p.y+10;
    if(withinX&&nearTop&&p.y<bestY){best=p;bestY=p.y;}
  }
  return best;
}
function slopeSupport(obj){
  if(!slopes.length||obj.looping)return null;
  const cx=obj.x+obj.w/2;
  const foot=obj.y+obj.h;
  let best=null,bestDy=Infinity;
  for(const s of slopes){
    const minX=Math.min(s.x1,s.x2),maxX=Math.max(s.x1,s.x2);
    if(cx<minX||cx>maxX)continue;
    const t=(cx-s.x1)/(s.x2-s.x1||1);
    const y=s.y1+(s.y2-s.y1)*t;
    const dy=foot-y;
    if(dy>=-14&&dy<=16&&Math.abs(dy)<bestDy){
      const ang=Math.atan2(s.y2-s.y1,s.x2-s.x1);
      best={y,angle:ang,slope:s,dy};
      bestDy=Math.abs(dy);
    }
  }
  return best;
}
function tryEnterLoop(obj){
  if(gameLevel!==1||obj.vy<-1)return false;
  const cx=obj.x+obj.w/2;
  const speed=Math.abs(obj.groundSpeed||obj.vx);
  for(const loop of loopTracks){
    const enteringRight=cx>=loop.entry-14&&cx<=loop.entry+40&&obj.groundSpeed>4.1;
    const enteringLeft=cx<=loop.exit+14&&cx>=loop.exit-40&&obj.groundSpeed<-4.1;
    if(enteringRight||enteringLeft){
      obj.looping=true;
      obj.loopTrack=loop;
      obj.onGround=true;
      obj.carrier=null;
      obj.loopAngle=enteringRight?Math.PI:0;
      obj.rot=obj.loopAngle+Math.PI/2;
      obj.groundSpeed=enteringRight?Math.max(speed,5.4):-Math.max(speed,5.4);
      obj.vx=0;obj.vy=0;
      return true;
    }
  }
  return false;
}
function updateLoopPhysics(obj,inputDir,jumpPressed){
  const loop=obj.loopTrack;
  if(!loop){obj.looping=false;return false;}
  if(jumpPressed){
    const tx=Math.cos(obj.loopAngle),ty=Math.sin(obj.loopAngle);
    obj.looping=false;obj.loopTrack=null;obj.onGround=false;
    obj.vx=tx*(obj.groundSpeed||5);
    obj.vy=ty*(obj.groundSpeed||5)-4;
    obj.rot=0;
    return false;
  }
  const tangentX=-Math.sin(obj.loopAngle);
  const tangentY=Math.cos(obj.loopAngle);
  const gravityAlong=GRAVITY*1.15*tangentY;
  obj.groundSpeed+=(inputDir*0.18)-gravityAlong;
  obj.groundSpeed*=0.997;
  obj.loopAngle+=obj.groundSpeed/loop.r;
  obj.rot=obj.loopAngle+Math.PI/2;
  const topHalf=Math.sin(obj.loopAngle)<-0.12;
  if(topHalf&&Math.abs(obj.groundSpeed)<3.9){
    obj.looping=false;obj.loopTrack=null;obj.onGround=false;
    obj.vx=tangentX*obj.groundSpeed;
    obj.vy=tangentY*obj.groundSpeed+1;
    obj.rot=0;
    return false;
  }
  if(obj.groundSpeed>=0&&obj.loopAngle>=Math.PI*2){
    obj.looping=false;obj.loopTrack=null;obj.loopAngle=0;obj.rot=0;
    obj.x=loop.exit-obj.w/2;obj.y=loop.y+loop.r-obj.h;obj.onGround=true;obj.vx=obj.groundSpeed;obj.vy=0;
    return true;
  }
  if(obj.groundSpeed<0&&obj.loopAngle<=-Math.PI){
    obj.looping=false;obj.loopTrack=null;obj.loopAngle=0;obj.rot=0;
    obj.x=loop.entry-obj.w/2;obj.y=loop.y+loop.r-obj.h;obj.onGround=true;obj.vx=obj.groundSpeed;obj.vy=0;
    return true;
  }
  const cx=loop.x+Math.cos(obj.loopAngle)*loop.r;
  const cy=loop.y+Math.sin(obj.loopAngle)*loop.r;
  obj.x=cx-obj.w/2;
  obj.y=cy-obj.h/2;
  obj.vx=tangentX*obj.groundSpeed;
  obj.vy=tangentY*obj.groundSpeed;
  obj.onGround=true;
  return true;
}
function resolvePlayerPhysics(inputDir,jumpPressed){
  if(player.looping&&updateLoopPhysics(player,inputDir,jumpPressed))return;
  if(player.looping&&!player.loopTrack){
    // loop released into air, continue with free physics below
  }
  if(!player.looping&&(!player.onGround||!slopes.length))player.rot*=0.6;
  const accel=player.onGround?0.3:0.16;
  const maxSpd=powerUps.speed>0?FAST_SPEED+1.8:BASE_SPEED+1.8;
  if(inputDir!==0){
    player.groundSpeed+=inputDir*accel;
    player.groundSpeed=Math.max(-maxSpd,Math.min(maxSpd,player.groundSpeed));
    player.facing=inputDir;
  }else if(player.onGround){
    player.groundSpeed*=0.86;
    if(Math.abs(player.groundSpeed)<0.05)player.groundSpeed=0;
  }
  // Jump buffer: register press for up to 8 frames
  const jumpKey=(keys['ArrowUp']||keys['KeyW']||keys['Space']);
  if(jumpKey&&!jumpConsumed) jumpBuffer=8;
  else if(!jumpKey){jumpConsumed=false;}
  if(jumpBuffer>0) jumpBuffer--;

  // Coyote time: allow jump for 6 frames after walking off edge
  if(player.onGround){coyoteTime=6;player.jumpsLeft=2;}
  else if(coyoteTime>0) coyoteTime--;

  const canFirstJump=coyoteTime>0&&jumpBuffer>0&&!jumpConsumed;
  const canDoubleJump=!canFirstJump&&jumpBuffer>0&&!jumpConsumed&&player.jumpsLeft>0&&!player.onGround&&coyoteTime===0;
  if(canFirstJump){
    player.vy=JUMP;
    player.onGround=false;
    player.carrier=null;
    jumpConsumed=true;
    jumpBuffer=0;
    coyoteTime=0;
    player.jumpsLeft=1;
  } else if(canDoubleJump){
    player.vy=JUMP*0.88; // slightly lower double jump
    player.vx=player.groundSpeed; // preserve momentum
    jumpConsumed=true;
    jumpBuffer=0;
    player.jumpsLeft=0;
    // Puff effect reuse: spawn a couple ice shards as visual dust
    for(let i=0;i<3;i++) abilities.ice.shards.push({x:player.x+player.w/2,y:player.y+player.h,vx:(Math.random()-0.5)*3,vy:Math.random()*2+1,life:18});
  }
  // Variable jump: releasing early = short jump
  if(!jumpKey&&player.vy<0&&!player.onGround){player.vy*=0.78;}
  if(player.onGround){
    if(player.carrier)player.x+=player.carrier.dx||0;
    player.vx=player.groundSpeed;
  }else{
    player.vx+=inputDir*0.08;
    const airMax=maxSpd+2;
    player.vx=Math.max(-airMax,Math.min(airMax,player.vx));
  }
  resolveAABB(player,playerPlats());
  const slopeHit=slopeSupport(player);
  if(slopeHit&&player.vy>=-1){
    player.y=slopeHit.y-player.h;
    player.vy=0;
    player.onGround=true;
    player.rot=slopeHit.angle*0.35;
    player.groundSpeed+=Math.sin(slopeHit.angle)*0.12;
  }else if(!player.looping&&player.onGround){
    player.rot*=0.7;
  }
  const support=platformSupport(player);
  if(player.onGround&&(support||slopeHit)){
    player.groundSpeed=player.vx;
    player.carrier=support&&movingPlats.includes(support)?support:null;
    tryEnterLoop(player);
  }else{
    player.carrier=null;
    if(!player.onGround)player.groundSpeed=player.vx;
  }
}
function resolveAABB(obj,plats){
  obj.vy+=GRAVITY;obj.x+=obj.vx;
  // Side-push only for thick solid platforms, never for thin/one-way platforms
  for(let p of plats){
    if(p.h<=20)continue;
    if(ovlp(obj,p)){obj.vx>0?obj.x=p.x-obj.w:obj.x=p.x+p.w;obj.vx=0;}
  }
  obj.y+=obj.vy;obj.onGround=false;
  for(let p of plats){
    if(!ovlp(obj,p))continue;
    if(p.h<=20){
      // One-way: only land on top when falling down onto it
      if(obj.vy>0&&obj.y+obj.h-obj.vy<=p.y+4){obj.y=p.y-obj.h;obj.onGround=true;obj.vy=0;}
    }else{
      if(obj.vy>0){obj.y=p.y-obj.h;obj.onGround=true;}else{obj.y=p.y+p.h;}obj.vy=0;
    }
  }
}
function ovlp(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function dist2(a,b){const dx=(a.x+a.w/2)-(b.x+b.w/2),dy=(a.y+a.h/2)-(b.y+b.h/2);return Math.sqrt(dx*dx+dy*dy);}
function zeroPad(n,d){return String(n).padStart(d,'0');}

// ── ABILITY SYSTEM ────────────────────────────────────────────────────
function updateAbilities(){
  const px=player.x+player.w/2,py=player.y+player.h/2;

  // FIRE — shoots BOTH DIRECTIONS
  const fireOn=keys['KeyF'];
  abilities.fire.active=fireOn;
  if(abilities.fire.cooldown>0)abilities.fire.cooldown--;
  if(fireOn&&abilities.fire.cooldown<=0){
    for(let dir of[1,-1]){ // both front and back
      for(let i=0;i<2;i++){
        const spr=(Math.random()-0.5)*0.8;
        const spd=5+Math.random()*3;
        abilities.fire.particles.push({
          x:px+dir*14,y:py-4+(Math.random()-0.5)*5,
          vx:dir*spd*(player.facing===dir?1:0.9),vy:spr,
          life:20+Math.random()*10,maxLife:30,r:6+Math.random()*5,dir
        });
      }
    }
    abilities.fire.cooldown=4;
  }
  abilities.fire.particles=abilities.fire.particles.filter(p=>p.life>0);
  for(let p of abilities.fire.particles){p.x+=p.vx;p.y+=p.vy;p.vx*=0.93;p.vy+=0.07;p.life--;p.r*=0.97;}
  for(let fp of abilities.fire.particles){
    for(let e of enemies){
      if(!e.alive)continue;
      if(Math.hypot(fp.x-(e.x+e.w/2),fp.y-(e.y+e.h/2))<16){
        if(e.type==='brute'){e.hp--;if(e.hp<=0){e.alive=false;score+=200;}}
        else{e.alive=false;score+=100;}
        fp.life=0;
      }
    }
    if(boss&&boss.alive&&boss.active&&Math.hypot(fp.x-(boss.x+boss.w/2),fp.y-(boss.y+boss.h/2))<boss.w*0.6){boss.hp=Math.max(0,boss.hp-0.06);fp.life=0;if(boss.hp<=0)bossDead(boss);}
  }

  // ICE — shoots BOTH DIRECTIONS
  const iceOn=keys['KeyR'];
  abilities.ice.active=iceOn;
  if(abilities.ice.cooldown>0)abilities.ice.cooldown--;
  if(iceOn&&abilities.ice.cooldown<=0){
    for(let dir of[1,-1]){
      for(let i=0;i<1;i++){
        const spr=(Math.random()-0.5)*1.0;
        abilities.ice.shards.push({
          x:px+dir*14,y:py+(Math.random()-0.5)*6,
          vx:dir*(6.5+Math.random()*2),vy:spr-0.4,
          life:38+Math.random()*10,r:4+Math.random()*3,dir
        });
      }
    }
    abilities.ice.cooldown=9;
  }
  abilities.ice.shards=abilities.ice.shards.filter(s=>s.life>0);
  for(let s of abilities.ice.shards){s.x+=s.vx;s.y+=s.vy;s.vy+=0.18;s.life--;}
  for(let s of abilities.ice.shards){
    for(let e of enemies){
      if(!e.alive)continue;
      if(Math.hypot(s.x-(e.x+e.w/2),s.y-(e.y+e.h/2))<15){e.frozen=200;s.life=0;score+=60;}
    }
    if(boss&&boss.alive&&boss.active&&Math.hypot(s.x-(boss.x+boss.w/2),s.y-(boss.y+boss.h/2))<boss.w*0.55){boss.frozen=120;boss.hp=Math.max(0,boss.hp-0.5);s.life=0;if(boss.hp<=0)bossDead(boss);}
  }

  // RAD AURA
  if(keys['KeyQ']&&!abilities.rad._held){abilities.rad.active=!abilities.rad.active;abilities.rad._held=true;}
  if(!keys['KeyQ'])abilities.rad._held=false;
  if(abilities.rad.active){
    abilities.rad.timer++;
    for(let e of enemies){
      if(!e.alive)continue;
      if(dist2(player,e)<abilities.rad.radius){
        e.melting=(e.melting||0)+1;
        if(e.type==='brute'&&e.melting>150){e.alive=false;score+=200;}
        else if(e.melting>80){e.alive=false;score+=150;}
      }
    }
    if(boss&&boss.alive&&boss.active&&dist2(player,boss)<abilities.rad.radius+20){
      boss.melting=(boss.melting||0)+1;
      if(boss.melting%70===0){boss.hp=Math.max(0,boss.hp-1);if(boss.hp<=0)bossDead(boss);}
    }
  } else{abilities.rad.timer=0;}
  for(let e of enemies){if(e.frozen>0)e.frozen--;}
  if(boss&&boss.frozen>0)boss.frozen--;
}

// ── MAIN UPDATE ───────────────────────────────────────────────────────
function update(){
  if(msgShown)return;
  // Handle special cinematic states
  if(state==='flyout1'){
    tick++;
    flyOutAnim.timer++;
    player.x+=flyOutAnim.vx;
    player.y+=flyOutAnim.vy;
    flyOutAnim.vy-=0.18;
    flyOutAnim.vx+=0.1;
    camera.x+=(player.x-W/3-camera.x)*0.12;
    if(flyOutAnim.timer>120){
      // Transition to level 2
      gameLevel=2;
      state='transition';
      showMsg('ZONE CLEAR','>> ZONE 1 CLEAR! <<','RED FALCON DESTROYED!<br>BANANA MAN SOARS TO ZONE 2...<br><br>ZONE 2 AWAITS...','NEXT ZONE');
    }
    return;
  }
  if(state==='flyout2'){
    tick++;
    flyOutAnim.timer++;
    player.x+=flyOutAnim.vx;
    player.y+=flyOutAnim.vy;
    flyOutAnim.vy-=0.2;
    flyOutAnim.vx+=0.15;
    camera.x+=(player.x-W/3-camera.x)*0.12;
    if(flyOutAnim.timer>140){
      state='win';
      showMsg('YOU WIN!','>> VICTORY!! <<','DARK MATTER ROBOT DESTROYED!<br>BANANA MAN FLIES INTO THE COSMOS!<br><br>FINAL SCORE: '+zeroPad(score,6),'PLAY AGAIN');
    }
    return;
  }
  if(state==='glitching'){
    tick++;
    glitchAnim.timer++;
    // after glitch completes, spawn dark matter and human wave
    if(glitchAnim.timer>=glitchAnim.maxTimer){
      glitchAnim.active=false;
      state='playing';
      // spawn dark matter bot near player
      boss=mkDarkMatter(player.x+500);
      boss.active=true;
      darkMatterSpawned=true;
      spawnHumanWave();
    }
    return;
  }
  if(state!=='playing')return;
  tick++;

  // Check if phionix flee triggered glitch
  if(glitchAnim.active && !darkMatterSpawned){
    state='glitching';
    return;
  }

  moveMovingPlatforms();

  // power-up timers
  if(powerUps.bigBanana>0){
    const prevH=player.h;
    powerUps.bigBanana--;
    if(powerUps.bigBanana>0){
      // still big — grow if not already big (first frame)
      if(player.h!==42){player.y-=(42-prevH);player.w=30;player.h=42;}
    } else {
      // expired — shrink back, anchor feet so we don't clip floor/ceiling
      if(player.h!==28){player.y+=(player.h-28);player.w=18;player.h=28;}
    }
  }
  if(powerUps.speed>0)powerUps.speed--;

  const inputDir=(keys['ArrowLeft']||keys['KeyA']?-1:0)+(keys['ArrowRight']||keys['KeyD']?1:0);
  const jumpPressed2=(keys['ArrowUp']||keys['KeyW']||keys['Space']);
  resolvePlayerPhysics(Math.max(-1,Math.min(1,inputDir)),jumpPressed2);

  // spring collision
  for(let s of springs){
    if(s.timer>0)s.timer--;
    // player lands on top of spring
    if(player.x+player.w>s.x&&player.x<s.x+s.w&&
       player.y+player.h>=s.y&&player.y+player.h<=s.y+s.h+8&&player.vy>=0){
      player.y=s.y-player.h;
      player.vy=s.big?-42:JUMP*1.9; // giant spring launches way up to surface
      player.onGround=false;
      player.jumpsLeft=2;
      jumpConsumed=false;
      coyoteTime=0;
      s.timer=s.big?20:12;
    }
  }

  // hazard collision
  for(let h of hazards){
    if(h.type==='lava'){
      if(ovlp(player,h))hurt();
    }else if(player.x<h.x+h.w&&player.x+player.w>h.x&&player.y+player.h>h.y&&player.y+player.h<h.y+h.h+8){
      hurt();
    }
  }

  if(player.y>1700){lives--;lives<=0?(state='gameover',showMsg('GAME OVER','>> GAME OVER <<','BANANA MAN FELL!!<br>SCORE: '+zeroPad(score,6),'TRY AGAIN')):(state='dead',showMsg('OOPS!','>> FELL!! <<','WATCH THE GAPS!','RETRY'));return;}
  player.anim++;
  if(player.anim%5===0)player.frame=(player.frame+1)%4;
  if(player.inv>0)player.inv--;
  // Horizontal camera
  camera.x+=(player.x-W/3-camera.x)*0.1;
  if(camera.x<0)camera.x=0;
  // Vertical camera — dead zone so small jumps don't scroll
  const targetCY=player.y-H*0.45;
  const cy=camera.y||0;
  const dy=targetCY-cy;
  if(Math.abs(dy)>40) camera.y=cy+dy*0.08; // only scroll if player moves far from center
  if(camera.y<-60)camera.y=-60;
  if(camera.y>1300)camera.y=1300;

  updateAbilities();

  for(let pk of pickups){
    if(!pk.collected&&ovlp(player,{x:pk.x-10,y:pk.y-10,w:20,h:20})){
      pk.collected=true;
      if(pk.t==='b'){bananas++;score+=10;}
      else if(pk.t==='bigBanana'){powerUps.bigBanana=90*60;score+=500;}
      else if(pk.t==='shield'){powerUps.shield=true;score+=300;}
      else if(pk.t==='fast'){powerUps.speed=10*60;score+=200;}
    }
  }

  for(let e of enemies){
    if(!e.alive)continue;
    e.anim++;e.timer=(e.timer||0)+1;
    if(e.type==='floater'){
      e.y=e.floatY+Math.sin(tick*e.floatSpd+e.startX*0.01)*e.floatAmp;
      e.x+=e.vx;
      if(e.x<e.startX-e.range){e.x=e.startX-e.range;e.vx=Math.abs(e.vx);}
      if(e.x>e.startX+e.range){e.x=e.startX+e.range;e.vx=-Math.abs(e.vx);}
    } else {
      if(e.frozen>0)continue;
      if(e.timer%70===0)e.vx*=-1;
      if(e.x<e.startX-e.range){e.vx=Math.abs(e.vx);}
      if(e.x>e.startX+e.range){e.vx=-Math.abs(e.vx);}
      // Edge detection: probe one step ahead — if no ground, reverse
      const stepX=e.x+e.vx*(e.type==='brute'?1.5:1.2);
      const probeX=e.vx>0?stepX+e.w:stepX;
      const probeY=e.y+e.h+4;
      let hasGround=false;
      for(const p of allPlats()){
        if(probeX>=p.x&&probeX<=p.x+p.w&&probeY>=p.y&&probeY<=p.y+p.h+2){hasGround=true;break;}
      }
      for(const s of slopes){
        const minX=Math.min(s.x1,s.x2),maxX=Math.max(s.x1,s.x2);
        if(probeX>=minX&&probeX<=maxX){const t=(probeX-s.x1)/(s.x2-s.x1||1);const sy=s.y1+(s.y2-s.y1)*t;if(Math.abs(probeY-sy)<20){hasGround=true;break;}}
      }
      if(!hasGround)e.vx*=-1;
      resolveAABB(e,allPlats());
    }
    if(ovlp(player,e)){
      if(player.vy>0&&player.y+player.h<e.y+e.h*0.55){
        if(e.type==='brute'){e.hp--;if(e.hp<=0){e.alive=false;score+=200;}player.vy=-9;}
        else{e.alive=false;score+=100;player.vy=-8;}
      } else if(player.inv<=0)hurt();
    }
  }
  // Update human enemy wave
  if(humanWave.active){
    humanWave.waveTimer++;
    for(let e of humanWave.enemies){
      if(!e.alive)continue;
      e.anim++;e.timer=(e.timer||0)+1;
      if(e.frozen>0){e.frozen--;continue;}
      // move toward player
      const dx=player.x-e.x;
      if(Math.abs(dx)>8){e.vx=Math.sign(dx)*(1.4+Math.random()*0.4);}
      e.startX=e.x;
      resolveAABB(e,allPlats());
      if(ovlp(player,e)){
        if(player.vy>0&&player.y+player.h<e.y+e.h*0.6){
          e.hp--;if(e.hp<=0){e.alive=false;score+=150;}player.vy=-8;
        } else if(player.inv<=0)hurt();
      }
    }
    // Fire/ice/rad vs human enemies
    for(let fp of abilities.fire.particles){
      for(let e of humanWave.enemies){
        if(!e.alive)continue;
        if(Math.hypot(fp.x-(e.x+e.w/2),fp.y-(e.y+e.h/2))<14){
          e.hp--;if(e.hp<=0){e.alive=false;score+=150;}fp.life=0;
        }
      }
    }
    for(let s of abilities.ice.shards){
      for(let e of humanWave.enemies){
        if(!e.alive)continue;
        if(Math.hypot(s.x-(e.x+e.w/2),s.y-(e.y+e.h/2))<13){e.frozen=180;s.life=0;}
      }
    }
    if(abilities.rad.active){
      for(let e of humanWave.enemies){
        if(!e.alive)continue;
        if(dist2(player,e)<abilities.rad.radius+15){
          e.melting=(e.melting||0)+1;if(e.melting>70){e.alive=false;score+=120;}
        }
      }
    }
    const allDead=humanWave.enemies.every(e=>!e.alive);
    if(allDead&&!boss)humanWave.cleared=true;

    // After 1 min (3600 ticks), spawn anti-matter bot + phionix returns
    if(humanWave.waveTimer===3600){
      antiMatterBot={active:true,x:player.x-200,y:160,w:50,h:50,vx:0,vy:0,hp:8,alive:true,anim:0};
      // Phionix returns
      if(!boss){
        boss=mkPhionix(player.x+400);
        boss.active=true;
        boss.hp=4;boss.maxHp=4;
        phionixHalfTriggered=true; // prevent re-flee
      }
    }
  }

  // Update anti-matter bot (follows player)
  if(antiMatterBot.active&&antiMatterBot.alive){
    antiMatterBot.anim++;
    const dx=player.x+player.w/2-(antiMatterBot.x+antiMatterBot.w/2);
    const dy=player.y+player.h/2-(antiMatterBot.y+antiMatterBot.h/2);
    const d=Math.sqrt(dx*dx+dy*dy)||1;
    antiMatterBot.vx+=(dx/d)*0.12;antiMatterBot.vy+=(dy/d)*0.08;
    antiMatterBot.vx*=0.96;antiMatterBot.vy*=0.96;
    antiMatterBot.x+=antiMatterBot.vx;antiMatterBot.y+=antiMatterBot.vy;
    // Hurt player on contact
    if(ovlp(player,antiMatterBot)&&player.inv<=0)hurt();
    // Fire/ice/rad vs anti-matter bot
    for(let fp of abilities.fire.particles){
      if(Math.hypot(fp.x-(antiMatterBot.x+antiMatterBot.w/2),fp.y-(antiMatterBot.y+antiMatterBot.h/2))<antiMatterBot.w*0.55){
        antiMatterBot.hp=Math.max(0,antiMatterBot.hp-0.08);fp.life=0;
        if(antiMatterBot.hp<=0)antiMatterBot.alive=false;
      }
    }
    for(let s of abilities.ice.shards){
      if(Math.hypot(s.x-(antiMatterBot.x+antiMatterBot.w/2),s.y-(antiMatterBot.y+antiMatterBot.h/2))<antiMatterBot.w*0.5){
        antiMatterBot.hp=Math.max(0,antiMatterBot.hp-0.6);s.life=0;
        if(antiMatterBot.hp<=0)antiMatterBot.alive=false;
      }
    }
    if(abilities.rad.active&&dist2(player,antiMatterBot)<abilities.rad.radius+20){
      antiMatterBot.hp=Math.max(0,antiMatterBot.hp-0.015);
      if(antiMatterBot.hp<=0)antiMatterBot.alive=false;
    }
    // Stomp
    if(ovlp(player,antiMatterBot)&&player.vy>0&&player.y+player.h<antiMatterBot.y+antiMatterBot.h*0.5){
      antiMatterBot.hp-=2;player.vy=-9;
      if(antiMatterBot.hp<=0)antiMatterBot.alive=false;
    }
  }

  // Update checkpoints
  for(let cp of checkpoints){
    if(cp.animTimer>0)cp.animTimer--;
    if(!cp.triggered&&player.x+player.w>cp.x&&player.x<cp.x+20&&player.y+player.h>cp.y&&player.y<cp.y+60){
      cp.triggered=true;cp.animTimer=90;
      lastCheckpoint={x:cp.x,y:cp.y};
      score+=200;
    }
  }
  if(boss&&boss.alive&&!boss.active&&player.x>=boss.activateX){
    boss.active=true;
  }
  if(boss&&boss.alive&&boss.active)updateBoss();
  updateUI();
}

function hurt(){
  if(player.inv>0)return;
  if(powerUps.bigBanana>0)return;
  if(powerUps.shield){powerUps.shield=false;player.inv=60;player.vy=-6;return;}
  bananas>0?(bananas=Math.max(0,bananas-5),score=Math.max(0,score-50)):lives--;
  player.inv=90;player.vy=-7;
  if(lives<=0){state='gameover';showMsg('GAME OVER','>> GAME OVER <<','BANANA MAN IS DONE!!<br>SCORE: '+zeroPad(score,6),'TRY AGAIN');}
}

function updateBoss(){
  const b=boss;b.anim++;b.timer++;
  if(b.frozen>0){b.frozen--;return;}
  const rage=b.hp<b.maxHp*0.4; // enrage at low HP
  const spd=(rage?1.5:1);
  if(b.type==='falcon'){
    const bx1=gameLevel===1?6870:5900,bx2=bx1+600;
    b.vy+=GRAVITY*0.4;b.x+=b.vx*spd;b.y+=b.vy;
    if(b.x<bx1){b.x=bx1;b.vx=Math.abs(b.vx);}
    if(b.x>bx2){b.x=bx2;b.vx=-Math.abs(b.vx);}
    if(b.y<195){b.y=195;b.vy=Math.abs(b.vy);}
    if(b.y>255){b.y=255;b.vy=-Math.abs(b.vy)+0.1;}
    b.shootT=(b.shootT||0)+1;
    const freq=rage?55:90;
    if(b.shootT%freq===0){
      const dx=player.x-b.x,dy=player.y-b.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      b.projectiles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:dx/d*5,vy:dy/d*5});
      if(rage){b.projectiles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:dx/d*5+1.5,vy:dy/d*5});
               b.projectiles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:dx/d*5-1.5,vy:dy/d*5});}
    }
  } else if(b.type==='phionix'){
    // Check half-health flee
    if(!phionixHalfTriggered && b.hp<=b.maxHp*0.5){
      phionixHalfTriggered=true;
      phionixFleeing.active=true;
      b.vx=4;b.vy=-3;
      glitchAnim={active:true,timer:0,maxTimer:240};
      return;
    }
    if(phionixFleeing.active){
      b.x+=phionixFleeing.vx;b.y+=phionixFleeing.vy;
      phionixFleeing.vx+=0.15;phionixFleeing.vy-=0.1;
      if(b.x>W+camera.x+300||b.y<-200){b.alive=false;boss=null;}
      return;
    }
    const bx1=5900,bx2=6500;
    b.vy+=GRAVITY*0.32;b.x+=b.vx*spd;b.y+=b.vy;
    if(b.x<bx1){b.x=bx1;b.vx=Math.abs(b.vx);}
    if(b.x>bx2){b.x=bx2;b.vx=-Math.abs(b.vx);}
    if(b.y<200){b.y=200;b.vy=1.2;}
    if(b.y>260){b.y=260;b.vy=-1.2;}
    b.shootT=(b.shootT||0)+1;
    const freq2=rage?45:75;
    if(b.shootT%freq2===0){
      for(let i=0;i<(rage?3:2);i++){
        const a=Math.atan2(player.y-b.y,player.x-b.x)+(i-(rage?1:0.5))*0.35;
        b.projectiles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*5.5,vy:Math.sin(a)*5.5});
      }
    }
  } else if(b.type==='dark'){
    const bx1=5950,bx2=6550;
    b.vy+=GRAVITY*0.25;b.x+=b.vx*spd;b.y+=b.vy;
    if(b.x<bx1){b.x=bx1;b.vx=Math.abs(b.vx)+0.03;}
    if(b.x>bx2){b.x=bx2;b.vx=-(Math.abs(b.vx)+0.03);}
    if(b.y<178){b.y=178;b.vy=1.8;}
    if(b.y>252){b.y=252;b.vy=-1.8;}
    const freq3=rage?50:75;
    if(b.timer%freq3===0){
      const shots=rage?5:3;
      for(let i=0;i<shots;i++){const a=(i/shots)*Math.PI*2+b.timer*0.01;b.projectiles.push({x:b.x+b.w/2,y:b.y+b.h/2,vx:Math.cos(a)*4.5,vy:Math.sin(a)*4.5});}
    }
  }
  for(let p of b.projectiles){p.x+=p.vx;p.y+=p.vy;if(ovlp(player,{x:p.x-5,y:p.y-5,w:10,h:10})){p.dead=true;if(player.inv<=0)hurt();}}
  b.projectiles=b.projectiles.filter(p=>!p.dead&&p.x>-300&&p.x<8000&&p.y<H+100);
  if(ovlp(player,b)){
    if(player.vy>0&&player.y+player.h<b.y+b.h*0.5){b.hp--;player.vy=-9;score+=500;if(b.hp<=0)bossDead(b);}
    else if(player.inv<=0)hurt();
  }
}

// ── CINEMATIC STATE VARS ──────────────────────────────────────────────
let flyOutAnim={active:false,vy:-2,vx:0,timer:0};
let glitchAnim={active:false,timer:0,maxTimer:180};
let humanWave={active:false,enemies:[],cleared:false,waveTimer:0};
let antiMatterBot={active:false,x:0,y:0,w:50,h:50,vx:0,vy:0,hp:1,alive:false,anim:0};
let phionixFleeing={active:false,vx:3,vy:-1.5};
let phionixHalfTriggered=false;
let darkMatterSpawned=false;

function mkHumanEnemy(x,y){
  return{type:'human',x,y,w:16,h:26,vx:(Math.random()>0.5?1:-1)*(1.2+Math.random()*1.2),vy:0,onGround:false,alive:true,anim:0,startX:x,range:200,frozen:0,melting:0,timer:0,hp:2};
}

function spawnHumanWave(){
  humanWave.active=true;humanWave.cleared=false;humanWave.waveTimer=0;
  humanWave.enemies=[];
  const px=player.x;
  for(let i=0;i<18;i++){
    const side=i%2===0?1:-1;
    const ox=80+i*70;
    humanWave.enemies.push(mkHumanEnemy(px+side*ox,260));
  }
}

function bossDead(b){
  score+=3000;
  if(b.type==='falcon'){
    // Level 1 boss defeated — Banana Man flies out
    boss=null;
    flyOutAnim={active:true,vy:-4,vx:5,timer:0};
    state='flyout1';
    return;
  }
  else if(b.type==='dark'){
    // Dark Matter Bot defeated — fly out of screen!
    boss=null;
    if(antiMatterBot.alive)antiMatterBot.alive=false;
    flyOutAnim={active:true,vy:-5,vx:4,timer:0};
    state='flyout2';
    return;
  }
}

function activateRealBoss(){
  boss=mkDarkMatter(player.x+700);
  boss.active=true;
  darkMatterSpawned=true;
  state='playing';
  spawnHumanWave();
}
function resetGame(){score=0;lives=3;bananas=0;gameLevel=1;state='playing';overlay.style.display='none';msgShown=false;initLevel(1);}
function updateUI(){
  document.getElementById('scoreUI').textContent='SCORE:'+zeroPad(score,6);
  let s='LIVES:'+lives+' BAN:'+zeroPad(bananas,2);
  if(powerUps.bigBanana>0)s+=' BIG:'+Math.ceil(powerUps.bigBanana/60);
  if(powerUps.shield)s+=' [SHLD]';
  if(powerUps.speed>0)s+=' SPD:'+Math.ceil(powerUps.speed/60);
  document.getElementById('livesUI').textContent=s;
}

// ── DRAW ──────────────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  const cx=Math.floor(camera.x);
  const cy=Math.floor(camera.y||0);

  if(gameLevel===1){drawBG1(cx);}else{drawBG2(cx);}

  ctx.save();ctx.translate(-cx,-cy);

  // loop-to-loop scenery
  for(let loop of loopDecos){
    drawLoopDeco(loop.x,loop.y,loop.r);
  }
  if(slopes.length){
    for(const s of slopes)drawSlopeTerrain(s);
  }
  drawRouteFeatures();

  // Draw underground tunnels
  if(gameLevel===1)drawUndergroundTunnels();

  // platforms (pixel-art style with top stripe)
  for(let pl of platforms){
    pxRect(pl.x,pl.y,pl.w,pl.h,pl.c);
    pxRect(pl.x,pl.y,pl.w,8,pl.ct);
    if(gameLevel===1){
      for(let bx=pl.x;bx<pl.x+pl.w;bx+=16){
        pxRect(bx,pl.y+10,8,8,((bx/16)%2===0)?'#cf7c2e':'#f1bb5a');
        pxRect(bx+8,pl.y+10,8,8,((bx/16)%2===0)?'#f1bb5a':'#cf7c2e');
      }
      ctx.fillStyle='rgba(22,80,18,0.22)';
      for(let bx=pl.x+4;bx<pl.x+pl.w;bx+=24){
        ctx.fillRect(bx,pl.y+24,2,pl.h-24);
      }
    }else{
      for(let bx=pl.x;bx<pl.x+pl.w;bx+=16){
        pxRect(bx,pl.y+10,8,8,((bx/16)%2===0)?'#2c7cff':'#50d8ff');
        pxRect(bx+8,pl.y+10,8,8,((bx/16)%2===0)?'#50d8ff':'#2c7cff');
      }
      ctx.fillStyle='rgba(8,12,44,0.28)';
      for(let bx=pl.x+5;bx<pl.x+pl.w;bx+=22){
        ctx.fillRect(bx,pl.y+22,2,pl.h-22);
      }
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.fillRect(pl.x+6,pl.y+5,Math.max(0,pl.w-12),2);
    }
  }
  // moving platforms
  for(let mp of movingPlats){
    pxRect(mp.x,mp.y,mp.w,mp.h,mp.c);
    pxRect(mp.x,mp.y,mp.w,5,mp.ct);
    // blinking warning lights
    const blink=Math.floor(tick/10)%2;
    ctx.fillStyle=gameLevel===1?(blink?'#ff0000':'#880000'):(blink?'#72f4ff':'#0f5488');
    ctx.fillRect(mp.x+2,mp.y+2,4,4);
    ctx.fillRect(mp.x+mp.w-6,mp.y+2,4,4);
    if(gameLevel===2){
      pxRect(mp.x+8,mp.y+7,mp.w-16,2,'#d8f8ff');
    }
  }

  // Draw checkpoints
  for(let cp of checkpoints){
    const px=cp.x, py=cp.y;
    const blink=cp.animTimer>0&&Math.floor(cp.animTimer/6)%2===0;
    const col=cp.triggered?'#ffdd00':'#ffffff';
    const shine=cp.triggered?'#ff8800':'#aaaaaa';
    // pole
    pxRect(px+7,py-40,6,100,'#888');
    pxRect(px+8,py-38,4,96,'#bbb');
    // flag body
    pxRect(px+13,py-40,34,22,cp.triggered?'#ff6600':'#cccccc');
    pxRect(px+13,py-38,32,18,col);
    // star/banana on flag
    pxRect(px+20,py-34,8,10,PAL.banana);
    pxRect(px+18,py-32,12,6,PAL.banana);
    pxRect(px+21,py-36,6,4,PAL.bananaDark);
    // base
    pxRect(px,py+58,20,6,'#666');
    if(blink||cp.animTimer>0){
      // sparkles
      ctx.fillStyle='#ffff00';
      for(let i=0;i<4;i++){
        const a=(i/4)*Math.PI*2+(cp.animTimer||0)*0.2;
        ctx.fillRect(px+10+Math.cos(a)*20-2,py+20+Math.sin(a)*20-2,4,4);
      }
    }
  }
  for(let h of hazards){
    if(h.type==='lava'){
      ctx.fillStyle='#cf2800';
      ctx.fillRect(h.x,h.y,h.w,h.h);
      ctx.fillStyle='#ff7a00';
      for(let lx=h.x;lx<h.x+h.w;lx+=18){
        const bob=(Math.sin((tick+lx)*0.08)+1)*3;
        ctx.fillRect(lx,h.y+2,12,6+bob);
      }
      ctx.fillStyle='#ffd25c';
      for(let lx=h.x+4;lx<h.x+h.w;lx+=24){
        ctx.fillRect(lx,h.y+4,6,3);
      }
    }else{
      ctx.fillStyle='#888';
      const n=Math.floor(h.w/10);
      for(let i=0;i<n;i++){
        ctx.fillStyle='#cccccc';
        ctx.beginPath();ctx.moveTo(h.x+i*10,h.y+h.h);ctx.lineTo(h.x+i*10+5,h.y);ctx.lineTo(h.x+i*10+10,h.y+h.h);ctx.closePath();ctx.fill();
        ctx.fillStyle='#888888';
        ctx.beginPath();ctx.moveTo(h.x+i*10,h.y+h.h);ctx.lineTo(h.x+i*10+5,h.y);ctx.lineTo(h.x+i*10+5,h.y+h.h);ctx.closePath();ctx.fill();
      }
    }
  }

  // springs
  for(let s of springs){
    const sx=Math.round(s.x), sy=Math.round(s.y);
    const squish=s.timer>0?(s.big?0.3:0.5):1.0;
    const sh=Math.round(s.h*squish);
    if(s.big){
      // giant spring — chunky, bright, with arrow indicator
      ctx.fillStyle='#555555';
      ctx.fillRect(sx,sy+s.h-6,s.w,6); // thick base
      ctx.fillStyle=s.timer>0?'#ff6600':'#ff2200';
      ctx.fillRect(sx+2,sy+s.h-6-sh,s.w-4,sh); // red coil body
      ctx.fillStyle='#ff8800';
      for(let i=0;i<5;i++){
        const ly=sy+s.h-6-sh+Math.round(i*(sh/5));
        ctx.fillRect(sx+2,ly,s.w-4,3);
      }
      // bright yellow cap
      ctx.fillStyle=s.timer>0?'#ffffff':'#ffff00';
      ctx.fillRect(sx,sy+s.h-6-sh-5,s.w,5);
      // upward arrow above spring
      if(s.timer===0){
        ctx.fillStyle='rgba(255,255,0,0.8)';
        const ax=sx+s.w/2, ay=sy-6;
        ctx.beginPath();ctx.moveTo(ax,ay-10);ctx.lineTo(ax-7,ay);ctx.lineTo(ax+7,ay);ctx.closePath();ctx.fill();
      }
    } else {
      // regular spring
      ctx.fillStyle='#888888';
      ctx.fillRect(sx,sy+s.h-4,s.w,4);
      ctx.fillStyle='#dddddd';
      ctx.fillRect(sx+2,sy+s.h-4-sh,s.w-4,sh);
      ctx.fillStyle='#aaaaaa';
      for(let i=0;i<3;i++){
        const ly=sy+s.h-4-sh+Math.round(i*(sh/3));
        ctx.fillRect(sx+2,ly,s.w-4,2);
      }
      ctx.fillStyle=s.timer>0?'#ff4400':'#ffee00';
      ctx.fillRect(sx,sy+s.h-4-sh-3,s.w,3);
    }
  }

  // pickups
  for(let pk of pickups){
    if(pk.collected)continue;
    if(pk.t==='b')drawBananaPx(pk.x,pk.y);
    else if(pk.t==='bigBanana')drawBigBananaPx(pk.x,pk.y);
    else if(pk.t==='shield')drawShieldPx(pk.x,pk.y);
    else if(pk.t==='fast')drawFastPx(pk.x,pk.y);
  }

  // radiation aura
  if(abilities.rad.active)drawRadAura(player);

  // ice shards
  for(let s of abilities.ice.shards)drawIcePx(s);

  // fire particles
  for(let fp of abilities.fire.particles)drawFirePx(fp);

  // enemies
  for(let e of enemies){if(e.alive)drawEnemy(e);}

  // boss
  if(boss&&boss.alive&&boss.active){
    if(boss.type==='falcon')drawFalconPx(boss);
    else if(boss.type==='phionix')drawPhionixPx(boss);
    else drawDarkPx(boss);
    // boss projectiles
    for(let p of boss.projectiles){
      const pc=boss.type==='dark'?PAL.purple:boss.type==='phionix'?PAL.orange:PAL.red;
      pxRect(p.x-3,p.y-3,6,6,pc);
      pxRect(p.x-1,p.y-1,2,2,PAL.white);
    }
  }

  drawBananaMan(player);
  ctx.restore();

  // Draw human wave enemies (screen space)
  if(humanWave.active){
    ctx.save();ctx.translate(-Math.floor(camera.x),-Math.floor(camera.y||0));
    for(let e of humanWave.enemies){if(e.alive)drawHumanEnemy(e);}
    ctx.restore();
    // Wave counter
    const alive=humanWave.enemies.filter(e=>e.alive).length;
    ctx.fillStyle='#ff4444';ctx.font='bold 7px "Press Start 2P",monospace';ctx.textAlign='center';
    ctx.fillText('ENEMIES: '+alive,W/2,20);ctx.textAlign='left';
  }

  // Draw anti-matter bot
  if(antiMatterBot.active&&antiMatterBot.alive){
    ctx.save();ctx.translate(-Math.floor(camera.x),-Math.floor(camera.y||0));
    drawAntiMatterBot(antiMatterBot);
    ctx.restore();
    // Anti-matter HP bar
    const bw=160,bh=10,bx=W/2-bw/2,by=H-44;
    pxRect(bx-2,by-2,bw+4,bh+4,'#111');
    pxRect(bx,by,bw,bh,'#333');
    pxRect(bx,by,Math.floor(bw*Math.max(0,antiMatterBot.hp/8)),bh,'#ffffff');
    ctx.strokeStyle='#ffffff';ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle='#ffffff';ctx.font='bold 6px "Press Start 2P",monospace';ctx.textAlign='center';
    ctx.fillText('ANTI-MATTER',W/2,by-3);ctx.textAlign='left';
  }

  // Glitch overlay
  if(state==='glitching'){
    const prog=glitchAnim.timer/glitchAnim.maxTimer;
    const blackness=Math.min(1,prog*2);
    ctx.fillStyle='rgba(0,0,0,'+blackness+')';
    ctx.fillRect(0,0,W,H);
    // Glitch lines
    if(Math.random()<0.6){
      for(let i=0;i<12;i++){
        const y=Math.random()*H;
        const h=2+Math.random()*8;
        const offset=(Math.random()-0.5)*40;
        ctx.drawImage(canvas,0,y,W,h,offset,y,W,h);
        const col=['#ff00ff','#00ffff','#ff0000','#00ff00'][Math.floor(Math.random()*4)];
        ctx.fillStyle=col.replace(')',',0.3)').replace('rgb','rgba').replace('#','#');
        ctx.globalAlpha=0.25;
        ctx.fillRect(0,y,W,h);
        ctx.globalAlpha=1;
      }
    }
    if(prog>0.5){
      ctx.fillStyle='rgba(0,0,0,'+(prog-0.5)*2+')';
      ctx.fillRect(0,0,W,H);
    }
    if(prog>0.8){
      ctx.fillStyle='#ffffff';ctx.font='bold 14px "Press Start 2P",monospace';ctx.textAlign='center';
      if(Math.random()<0.4)ctx.fillText('DARK MATTER AWAKENS',W/2,H/2);
      ctx.textAlign='left';
    }
    return; // skip other overlays during glitch
  }

  // Fly-out trail effect
  if(state==='flyout1'||state==='flyout2'){
    ctx.save();ctx.translate(-Math.floor(camera.x),-Math.floor(camera.y||0));
    // Speed lines
    ctx.strokeStyle='rgba(255,255,200,0.35)';ctx.lineWidth=2;
    for(let i=0;i<8;i++){
      const ox=-20-i*14,oy=(Math.random()-0.5)*8;
      ctx.beginPath();
      ctx.moveTo(player.x+player.w/2+ox,player.y+player.h/2+oy);
      ctx.lineTo(player.x+player.w/2+ox-40,player.y+player.h/2+oy);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Boss HP bar
  if(boss&&boss.alive&&boss.active){
    const bw=260,bh=12,bx=W/2-bw/2,by=H-28;
    pxRect(bx-2,by-2,bw+4,bh+4,'#111');
    pxRect(bx,by,bw,bh,'#333');
    const ratio=Math.max(0,boss.hp/boss.maxHp);
    const bc=boss.frozen>0?PAL.cyan:boss.type==='dark'?PAL.purple:boss.type==='phionix'?PAL.orange:PAL.red;
    pxRect(bx,by,Math.floor(bw*ratio),bh,bc);
    // HP bar segments
    ctx.fillStyle='rgba(0,0,0,0.3)';
    for(let i=1;i<boss.maxHp;i++)ctx.fillRect(bx+Math.floor(bw*i/boss.maxHp),by,1,bh);
    ctx.strokeStyle=PAL.white;ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,bh);
    const lbl=boss.type==='falcon'?'RED FALCON':boss.type==='phionix'?'PHIONIX':'DARK MATTER';
    ctx.fillStyle=PAL.banana;ctx.font='bold 8px "Press Start 2P",monospace';ctx.textAlign='center';
    ctx.fillText(lbl,W/2,by-4);ctx.textAlign='left';
  }

  // Ability HUD — retro box style
  drawRetroHUD();

  // Scanline flicker
  if(tick%4===0){
    ctx.fillStyle='rgba(255,255,255,0.01)';
    ctx.fillRect(0,Math.random()*H,W,2);
  }
}

// ── PIXEL ART HELPERS ─────────────────────────────────────────────────
function pxRect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);}

function drawRetroHUD(){
  const ab=[
    {k:'F',lbl:'FIRE',on:abilities.fire.active,c:PAL.red,oc:PAL.orange},
    {k:'R',lbl:'ICE ',on:abilities.ice.active, c:PAL.cyan,oc:'#0055aa'},
    {k:'Q',lbl:'RAD ',on:abilities.rad.active, c:PAL.lime,oc:'#005500'},
  ];
  ab.forEach((a,i)=>{
    const x=8,y=H-52+i*18,w=60,h=14;
    pxRect(x,y,w,h,a.on?a.oc:'#111');
    ctx.strokeStyle=a.on?a.c:'#444';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);
    if(a.on){ctx.strokeStyle=a.c;ctx.lineWidth=1;ctx.strokeRect(x+2,y+2,w-4,h-4);}
    ctx.fillStyle=a.on?a.c:'#555';
    ctx.font='6px "Press Start 2P",monospace';ctx.textAlign='left';
    ctx.fillText('['+a.k+']'+a.lbl,x+4,y+9);
  });
  ctx.textAlign='left';
}

// ── FIRE / ICE / RAD VISUALS ─────────────────────────────────────────
function drawFirePx(p){
  const t=p.life/p.maxLife;
  const r=Math.round(p.r);
  if(r<2)return;
  // pixel fire — chunky squares, NES palette
  ctx.globalAlpha=Math.min(1,t*2)*0.9;
  const c=t>0.6?PAL.white:t>0.3?PAL.banana:PAL.orange;
  pxRect(p.x-r/2,p.y-r/2,r,r,c);
  if(r>3){
    pxRect(p.x-r,p.y-r/3,r/2,r/2,PAL.red);
    pxRect(p.x+r/3,p.y-r/3,r/2,r/2,PAL.orange);
  }
  ctx.globalAlpha=1;
}

function drawIcePx(s){
  ctx.globalAlpha=Math.min(1,s.life/12)*0.95;
  const r=Math.round(s.r);
  // diamond pixel shard
  pxRect(s.x-1,s.y-r,2,r*2,PAL.white);
  pxRect(s.x-r,s.y-1,r*2,2,PAL.cyan);
  pxRect(s.x-r+1,s.y-r+1,r*2-2,r*2-2,PAL.cyan);
  pxRect(s.x-1,s.y-1,2,2,PAL.white);
  ctx.globalAlpha=1;
}

function drawRadAura(p){
  const cx=Math.round(p.x+p.w/2),cy=Math.round(p.y+p.h/2);
  const r=abilities.rad.radius;
  const t=tick;
  // pixelated concentric rings
  for(let ring=0;ring<3;ring++){
    const rr=r-ring*12+(t%16<8?2:0);
    ctx.strokeStyle=ring===0?PAL.lime:ring===1?PAL.green:'rgba(0,180,0,0.4)';
    ctx.lineWidth=ring===0?2:1;
    ctx.setLineDash([4,4]);ctx.lineDashOffset=t*0.5;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.stroke();
  }
  ctx.setLineDash([]);
  // rotating pixel particles
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2+t*0.04;
    const pr=r*0.65;
    pxRect(cx+Math.cos(a)*pr-2,cy+Math.sin(a)*pr-2,4,4,i%2===0?PAL.lime:PAL.green);
  }
}

function drawLoopDeco(x,y,r){
  ctx.save();
  ctx.translate(Math.round(x),Math.round(y));
  ctx.strokeStyle='#14903b';
  ctx.lineWidth=30;
  ctx.beginPath();ctx.arc(0,-r/2,r,0.08*Math.PI,0.92*Math.PI);ctx.stroke();
  ctx.beginPath();ctx.arc(0,-r/2,r,1.08*Math.PI,1.92*Math.PI);ctx.stroke();
  ctx.strokeStyle='#8ef978';
  ctx.lineWidth=10;
  ctx.beginPath();ctx.arc(0,-r/2,r,0.08*Math.PI,0.92*Math.PI);ctx.stroke();
  ctx.beginPath();ctx.arc(0,-r/2,r,1.08*Math.PI,1.92*Math.PI);ctx.stroke();
  for(let i=0;i<14;i++){
    const ang=0.12*Math.PI+i*0.13*Math.PI;
    const ringR=r-5;
    pxRect(Math.cos(ang)*ringR-7,-r/2+Math.sin(ang)*ringR-7,14,14,i%2?'#cf7c2e':'#f1bb5a');
  }
  for(let i=0;i<9;i++){
    const ang=0.18*Math.PI+i*0.2*Math.PI;
    pxRect(Math.cos(ang)*(r-22)-4,-r/2+Math.sin(ang)*(r-22)-4,8,8,'#0f6b28');
  }
  for(let i=0;i<4;i++){
    const side=i<2?-1:1;
    const yOff=-r/2+(i%2?20:-10);
    pxRect(side*(r-14)-5,yOff,10,10,PAL.banana);
  }
  ctx.restore();
}

function drawSlopeTerrain(s){
  if(Math.abs(s.y2-s.y1)<1)return;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(s.x1,s.y1);
  ctx.lineTo(s.x2,s.y2);
  ctx.lineTo(s.x2,H);
  ctx.lineTo(s.x1,H);
  ctx.closePath();
  ctx.fillStyle=gameLevel===1?PAL.ground1:'#22103d';
  ctx.fill();
  ctx.strokeStyle=gameLevel===1?PAL.ground1t:'#35d4ff';
  ctx.lineWidth=10;
  ctx.beginPath();
  ctx.moveTo(s.x1,s.y1);
  ctx.lineTo(s.x2,s.y2);
  ctx.stroke();
  const len=Math.hypot(s.x2-s.x1,s.y2-s.y1);
  const steps=Math.max(3,Math.floor(len/16));
  for(let i=0;i<steps;i++){
    const t=i/steps;
    const x=s.x1+(s.x2-s.x1)*t;
    const y=s.y1+(s.y2-s.y1)*t;
    const checker=gameLevel===1?(i%2?'#cf7c2e':'#f1bb5a'):(i%2?'#30c8ff':'#0d6cc4');
    pxRect(x-6,y+6,12,8,checker);
  }
  ctx.restore();
}

function drawRouteFeatures(){
  if(gameLevel!==1)return;
  const routes=[
    {x1:1300,x2:1648,top:320,floor:348,signX:1208,loopX:1474},
    {x1:3456,x2:3836,top:315,floor:348,signX:3344,loopX:3636},
    {x1:5764,x2:6128,top:318,floor:348,signX:5648,loopX:5920},
  ];
  for(const r of routes){
    // tunnel shadow so the under-route reads clearly
    ctx.fillStyle='rgba(10,24,62,0.48)';
    ctx.fillRect(r.x1,r.top,r.x2-r.x1,r.floor-r.top);
    ctx.fillStyle='rgba(255,255,255,0.10)';
    ctx.fillRect(r.x1+8,r.top+8,r.x2-r.x1-16,4);
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.fillRect(r.x1+18,r.top+16,r.x2-r.x1-36,10);

    // entrance arrows
    pxRect(r.signX,r.top-26,34,20,'#ffe14f');
    pxRect(r.signX+2,r.top-24,30,16,'#2048a8');
    pxRect(r.signX+14,r.top-21,4,10,'#ffe14f');
    pxRect(r.signX+10,r.top-17,12,4,'#ffe14f');

    // support pillars for the loop bridge
    pxRect(r.x1+18,r.top-34,10,34,'#8b5a2b');
    pxRect(r.x2-28,r.top-34,10,34,'#8b5a2b');
    pxRect(r.x1+20,r.top-30,6,30,'#d9a15b');
    pxRect(r.x2-26,r.top-30,6,30,'#d9a15b');

    // checker trim on the bridge face
    for(let i=0;i<9;i++){
      const bx=r.loopX-64+i*16;
      pxRect(bx,r.top-24,8,8,i%2?'#d88a2d':'#f4c056');
      pxRect(bx+8,r.top-24,8,8,i%2?'#f4c056':'#d88a2d');
    }

    // big drop-hole outlines so the lower route is obvious
    ctx.strokeStyle='#082040';
    ctx.lineWidth=4;
    ctx.strokeRect(r.x1,r.top,30,r.floor-r.top);
    ctx.strokeRect(r.x2-30,r.top,30,r.floor-r.top);
    pxRect(r.x1+8,r.top+10,14,6,'#aee6ff');
    pxRect(r.x2-22,r.top+10,14,6,'#aee6ff');
    pxRect(r.x1+10,r.floor-12,10,4,'#082040');
    pxRect(r.x2-20,r.floor-12,10,4,'#082040');
    for(let bx=r.x1+40;bx<r.x2-40;bx+=28){
      pxRect(bx,r.floor-8,14,4,'#28486a');
    }
  }
}

// ── PIXEL ART BANANA MAN (improved) ──────────────────────────────────
function drawBananaMan(p){
  if(p.inv>0&&Math.floor(p.inv/5)%2===0)return;
  const X=Math.round(p.x),Y=Math.round(p.y);
  const fl=p.facing<0;
  const run=p.onGround&&Math.abs(p.vx)>0.3;
  const jump=!p.onGround;
  const crouch=keys['ArrowDown']&&p.onGround;
  const big=powerUps.bigBanana>0;
  const sc=big?1.6:1;
  const fr=Math.floor(tick/6)%4; // 4-frame run cycle
  const skin='#f5c27a',skinDark='#d49a50',skinShade='#e8a85f';
  const shirt='#ffe030',shirtShade='#c8a800',shirtHi='#fff07a';
  const shorts='#1e5ac8',shortsHi='#3070e8',shortsDark='#0f3a88';
  const shoe='#5a2800',shoeHi='#7a3800';
  const capCol=PAL.bananaDark,capHi=PAL.banana,capTip='#f7f030';
  const hair='#4a2a08';

  ctx.save();
  ctx.translate(X+p.w/2,Y+p.h/2);
  if(p.looping)ctx.rotate(p.rot||0);
  if(fl)ctx.scale(-1,1);
  ctx.scale(sc,sc);

  // speed glow
  if(powerUps.speed>0){ctx.globalAlpha=0.2;pxRect(-10,-20,20,36,'#ffe85c');ctx.globalAlpha=1;}
  if(run&&Math.abs(p.groundSpeed||p.vx)>5.2){
    ctx.globalAlpha=0.14;
    pxRect(-14,-18,18,34,'#ffffff');pxRect(-20,-14,16,26,'#8ae8ff');
    ctx.globalAlpha=1;
    // motion lines behind
    ctx.strokeStyle='rgba(255,255,180,0.4)';ctx.lineWidth=2;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-16-i*8,-12+i*5);ctx.lineTo(-28-i*8,-12+i*5);ctx.stroke();}
  }

  // leg animation
  let lleg_y=0,rleg_y=0,lleg_x=0,rleg_x=0,bodyBob=0;
  if(crouch){lleg_y=-4;rleg_y=-4;bodyBob=4;}
  else if(jump){lleg_y=4;rleg_y=4;bodyBob=-2;}
  else if(run){
    const c=Math.cos(fr*Math.PI/2);
    lleg_y=Math.round(c*5);rleg_y=Math.round(-c*5);
    lleg_x=Math.round(c*2);rleg_x=Math.round(-c*2);
    bodyBob=Math.abs(c)*1.5;
  }

  const by=bodyBob; // body vertical offset

  // ── SHOES (drawn first, behind legs) ──
  pxRect(-10,17+lleg_y+by,12,6,shoe); pxRect(-11,19+lleg_y+by,14,4,shoe);
  pxRect(-11,21+lleg_y+by,14,3,shoeHi);
  pxRect(1,17+rleg_y+by,12,6,shoe);   pxRect(0,19+rleg_y+by,14,4,shoe);
  pxRect(0,21+rleg_y+by,14,3,shoeHi);

  // ── LEGS ──
  // left leg
  pxRect(-8+lleg_x,9+by,6,12+lleg_y,skin);
  pxRect(-7+lleg_x,9+by,4,12+lleg_y,skinShade);
  // right leg
  pxRect(2+rleg_x,9+by,6,12+rleg_y,skin);
  pxRect(3+rleg_x,9+by,4,12+rleg_y,skinShade);

  // ── SHORTS ──
  pxRect(-9,7+by,18,8,shorts);
  pxRect(-8,7+by,16,4,shortsHi);
  pxRect(-9,12+by,18,3,shortsDark);
  // shorts stripe
  pxRect(-8,9+by,2,4,'#ffffff');

  // ── TORSO ──
  pxRect(-9,-2+by,18,11,shirt);
  pxRect(-8,-1+by,16,8,shirtHi);
  pxRect(-9,6+by,18,3,shirtShade);
  // shirt details - star/logo
  pxRect(-3,-1+by,6,6,shirtShade);
  pxRect(-2,0+by,4,4,PAL.banana);
  pxRect(-1,1+by,2,2,'#ffffff');
  // collar
  pxRect(-4,-2+by,8,3,'#ffffff');
  pxRect(-3,-2+by,6,2,shirtShade);

  // ── ARMS ──
  const larm_y=run?Math.round(Math.sin(fr*Math.PI/2)*3):jump?-4:0;
  const rarm_y=run?Math.round(-Math.sin(fr*Math.PI/2)*3):jump?-4:0;
  // left arm
  pxRect(-13,-1+larm_y+by,5,10,shirt);
  pxRect(-14,0+larm_y+by,5,8,shirtShade);
  // left hand
  pxRect(-13,8+larm_y+by,5,5,skin);
  pxRect(-13,10+larm_y+by,5,2,skinDark);
  // right arm
  pxRect(8,-1+rarm_y+by,5,10,shirt);
  pxRect(8,0+rarm_y+by,5,8,shirtShade);
  // right hand
  pxRect(8,8+rarm_y+by,5,5,skin);
  pxRect(8,10+rarm_y+by,5,2,skinDark);

  // ── NECK ──
  pxRect(-3,-5+by,6,5,skin);

  // ── HEAD ──
  const headTilt=run?(fr%2===0?1:-1):0;
  ctx.translate(headTilt,0);
  // head shape - wider/more detailed
  pxRect(-9,-22+by,18,18,skin);
  // forehead highlight
  pxRect(-7,-21+by,14,4,skinShade);
  pxRect(-6,-20+by,12,2,'#f8d8a0');
  // cheeks
  pxRect(-9,-16+by,3,6,skinDark);
  pxRect(6,-16+by,3,6,skinDark);
  // chin
  pxRect(-7,-5+by,14,2,skinDark);

  // ── EYES (more expressive) ──
  const eyeC=abilities.fire.active?PAL.red:abilities.ice.active?PAL.cyan:abilities.rad.active?PAL.lime:'#1a0800';
  // eye whites
  pxRect(-7,-18+by,5,6,'#ffffff'); pxRect(2,-18+by,5,6,'#ffffff');
  // irises
  pxRect(-6,-17+by,3,4,'#3060d0'); pxRect(3,-17+by,3,4,'#3060d0');
  // pupils
  pxRect(-5,-16+by,2,2,eyeC); pxRect(4,-16+by,2,2,eyeC);
  // eye shine
  pxRect(-6,-17+by,1,1,'#ffffff'); pxRect(3,-17+by,1,1,'#ffffff');
  // eyelids / brow
  pxRect(-8,-19+by,6,2,hair); pxRect(2,-19+by,6,2,hair);
  if(jump){pxRect(-8,-19+by,6,1,'#000');pxRect(2,-19+by,6,1,'#000');}

  // ── NOSE + MOUTH ──
  pxRect(-1,-13+by,2,3,skinDark);
  pxRect(-4,-10+by,8,2,skinDark); // mouth line
  if(!jump)pxRect(-3,-10+by,6,1,'#c04040'); // smile color
  // teeth
  pxRect(-3,-10+by,2,2,'#ffffff'); pxRect(-1,-10+by,2,2,'#ffffff'); pxRect(1,-10+by,2,2,'#ffffff');
  // ears
  pxRect(-11,-18+by,3,6,skin); pxRect(-11,-17+by,2,4,skinDark);
  pxRect(8,-18+by,3,6,skin);  pxRect(9,-17+by,2,4,skinDark);

  // ── BANANA CAP (much more detailed) ──
  // cap body
  pxRect(-8,-30+by,16,9,capCol);
  pxRect(-7,-29+by,14,6,capHi);
  // cap brim
  pxRect(-10,-22+by,20,4,capCol);
  pxRect(-10,-22+by,20,2,'#a07000');
  // cap top/tip (banana shape)
  pxRect(-4,-36+by,8,7,capHi);
  pxRect(-3,-39+by,6,4,capHi);
  pxRect(-2,-41+by,4,3,capTip);
  pxRect(0,-43+by,2,3,'#fff880'); // tip tip
  // stripe on cap
  pxRect(-8,-28+by,16,2,'#ffee00');
  // cap back flap
  pxRect(-8,-30+by,4,10,capCol);
  ctx.translate(-headTilt,0);

  // ── FIRE BREATH / ICE / SHIELD ──
  if(abilities.fire.active){
    const fr3=Math.floor(tick/3)%4;
    const fcols=[PAL.white,PAL.banana,PAL.orange,PAL.red];
    for(let i=0;i<5+fr3;i++){
      const yo=Math.floor(Math.sin(tick*0.4+i)*3);
      pxRect(10+i*5,-4+yo,5,6,fcols[Math.min(i,3)]);
      pxRect(-15-i*5,-4-yo,5,6,fcols[Math.min(i,3)]);
    }
  }
  if(abilities.ice.active&&Math.floor(tick/6)%2===0){
    for(let i=0;i<4;i++){
      pxRect(10+i*7,-2+i*3,5,3,PAL.white);

function drawUndergroundTunnels(){
  // Draw the full deep cave from y=330 all the way down to y=1560
  const caveTop=330, caveBot=1600;
  const segments=[
    {x:0,w:700},{x:830,w:500},{x:1520,w:380},{x:2140,w:420},
    {x:2780,w:360},{x:3360,w:440},{x:4060,w:400},{x:4720,w:380},
    {x:5320,w:440},{x:6020,w:380},{x:6740,w:500},
  ];

  // Draw vertical shaft voids between ground chunks
  const gapRanges=[[370,460],[700,840],[1300,1560],[1880,2180],[2540,2820],
                   [3120,3400],[3780,4100],[4420,4760],[4980,5360],[5740,6060]];
  for(const [gx1,gx2] of gapRanges){
    // Shaft background — dark earth
    ctx.fillStyle='#061405';
    ctx.fillRect(gx1,310,gx2-gx1,caveBot-310);
    // Shaft walls (green mossy edges)
    ctx.fillStyle='#0e3a0a';
    ctx.fillRect(gx1,310,8,caveBot-310);
    ctx.fillRect(gx2-8,310,8,caveBot-310);
    // Green glow inside shaft
    ctx.fillStyle='rgba(0,180,40,0.07)';
    ctx.fillRect(gx1+8,310,gx2-gx1-16,caveBot-310);
    // Downward arrow guides every 150px
    for(let ay=380;ay<caveBot-60;ay+=150){
      pxRect((gx1+gx2)/2-6,ay,12,4,'#00dd44');
      pxRect((gx1+gx2)/2-3,ay+6,6,6,'#00dd44');
      pxRect((gx1+gx2)/2-0,ay+12,0,0,'#00dd44');
    }
  }

  // Draw main cave body (behind platforms)
  for(const seg of segments){
    const tunnelTop=caveTop, tunnelBot=caveBot;
    // Soil background
    ctx.fillStyle='#071a05';
    ctx.fillRect(seg.x,tunnelTop,seg.w,tunnelBot-tunnelTop);
    // Rock strata lines every 170px
    for(let sy=tunnelTop+80;sy<tunnelBot;sy+=170){
      ctx.fillStyle=`rgba(20,60,12,${0.4+Math.sin(sy*0.03)*0.2})`;
      ctx.fillRect(seg.x,sy,seg.w,6);
    }
    // Ceiling glow
    ctx.fillStyle='rgba(0,180,50,0.10)';
    ctx.fillRect(seg.x,tunnelTop,seg.w,20);
    // Glowing vines on ceiling
    ctx.fillStyle='rgba(0,220,60,0.14)';
    for(let vx=seg.x+20;vx<seg.x+seg.w-20;vx+=38){
      const vl=18+Math.sin(vx*0.08+tick*0.03)*10;
      ctx.fillRect(vx,tunnelTop+12,4,vl);
    }
    // Bioluminescent mushrooms on cavern floor
    for(let mx=seg.x+30;mx<seg.x+seg.w-10;mx+=55){
      const mh=8+Math.floor(mx*0.11)%10;
      pxRect(mx,tunnelBot-8-mh,8,mh,'#1a6612');
      pxRect(mx-5,tunnelBot-8-mh-7,18,8,'rgba(0,255,80,0.65)');
    }
    // Cave crystal formations at mid depths
    for(let cx2=seg.x+60;cx2<seg.x+seg.w-20;cx2+=120){
      const ch=12+Math.floor(cx2*0.07)%14;
      const cy2=800+Math.floor(cx2*0.13)%200;
      pxRect(cx2,cy2,6,ch,'rgba(0,200,100,0.5)');
      pxRect(cx2-3,cy2-4,12,6,'rgba(100,255,150,0.4)');
    }
    // Side wall detailing
    ctx.fillStyle='#0f3a0a';
    ctx.fillRect(seg.x,tunnelTop,6,tunnelBot-tunnelTop);
    ctx.fillRect(seg.x+seg.w-6,tunnelTop,6,tunnelBot-tunnelTop);
    // Floor at bottom
    ctx.fillStyle='#1a5c14';
    ctx.fillRect(seg.x,tunnelBot-8,seg.w,8);
  }
}

  if(e.melting>0){const ms=1-(e.melting/100)*0.4;ctx.scale(1,ms);ctx.globalAlpha=Math.max(0.2,1-e.melting/100);}
  // military human enemy
  const sw=Math.floor(e.anim/7)%2;
  // legs
  pxRect(-5,6,4,sw?10:8,'#3a6a3a');pxRect(1,6,4,sw?8:10,'#3a6a3a');
  pxRect(-6,sw?16:14,5,4,'#222');pxRect(1,sw?14:16,5,4,'#222');
  // body
  pxRect(-7,-8,14,16,'#3a6a3a');
  pxRect(-5,-6,10,12,'#2e5a2e');
  // arms
  pxRect(-11,-6+(sw?2:0),4,10,'#3a6a3a');pxRect(7,-6+(sw?0:2),4,10,'#3a6a3a');
  pxRect(-10,4+(sw?2:0),4,4,'#f5c080');pxRect(6,4+(sw?0:2),4,4,'#f5c080');
  // head
  pxRect(-5,-18,10,12,'#f5c080');
  pxRect(-6,-20,12,4,'#4a2e08');// hair
  pxRect(-4,-16,3,3,'#333');pxRect(1,-16,3,3,'#333');// eyes
  // HP pips
  for(let h=0;h<e.hp;h++)pxRect(-4+h*6,-26,4,3,PAL.red);
  if(e.frozen>0){ctx.strokeStyle=PAL.cyan;ctx.lineWidth=1;ctx.strokeRect(-8,-20,16,26);}
  ctx.restore();
}

// ── ANTI-MATTER BOT PIXEL ART ─────────────────────────────────────────
function drawAntiMatterBot(b){
  const t=b.anim,pulse=Math.floor(t/6)%2;
  ctx.save();ctx.translate(Math.round(b.x)+b.w/2,Math.round(b.y)+b.h/2);
  // glowing white outer ring
  ctx.strokeStyle=pulse?'#ffffff':'#ccccff';ctx.lineWidth=3+(pulse?2:0);
  ctx.beginPath();ctx.arc(0,0,30+pulse*3,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(200,200,255,0.3)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,38,0,Math.PI*2);ctx.stroke();
  // core body
  pxRect(-20,-20,40,40,'#e8e8ff');
  pxRect(-18,-18,36,36,'#f8f8ff');
  // inner pattern
  pxRect(-12,-12,24,24,'#aaaadd');
  pxRect(-8,-8,16,16,'#ffffff');
  // eyes
  pxRect(-8,-6,6,6,'#8800ff');pxRect(2,-6,6,6,'#8800ff');
  pxRect(-6,-4,2,2,'#ffffff');pxRect(4,-4,2,2,'#ffffff');
  // mouth
  pxRect(-6,4,12,3,'#8800ff');
  // orbiting white pixels
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2+t*0.06;
    pxRect(Math.cos(a)*36-2,Math.sin(a)*36-2,4,4,i%2?'#ffffff':'#aaaaff');
  }
  // HP glow tint at low HP
  if(b.hp<3){ctx.strokeStyle='#ff8800';ctx.lineWidth=3;ctx.strokeRect(-22,-22,44,44);}
  ctx.restore();
  // HP bar shown in caller
}
